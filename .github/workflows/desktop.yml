# Desktop builds for play-testers. Push a tag like v0.2.0 and the Windows .exe and Linux AppImage are
# attached to a GitHub Release of that name; run it by hand (Actions > Desktop builds) to get them as a
# workflow artifact instead. Both are unsigned: Windows shows a SmartScreen "More info > Run anyway".
name: Desktop builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - name: Player build
        run: npm run build:prod
      # electron-builder makes the Windows portable .exe on Linux without Wine (no signing)
      - name: Package
        run: npx electron-builder --win portable --linux AppImage --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: spell-vs-steel-desktop
          path: |
            release/*.exe
            release/*.AppImage
          retention-days: 30
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.exe release/*.AppImage --title "Spell VS Steel $GITHUB_REF_NAME" --generate-notes
