# Play-test builds: the Windows .exe, the Linux AppImage and the Android APK. Push a tag like v0.2.0, or run
# it by hand (Actions > Play-test builds) with a version filled in, and all three are attached to a GitHub
# Release of that name (the run makes the tag on the commit it built). Run it with the version left blank to
# get the files as workflow artifacts only. None are store-signed: Windows shows a SmartScreen "More info >
# Run anyway", and Android asks to allow installs from the browser or file manager.
name: Play-test builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.2.0 (blank: build only, no Release)'
        required: false
        default: ''

permissions:
  contents: write

env:
  # the tag being released: the pushed tag, or v<version> from a manual run (empty: no Release)
  TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.version != '' && format('v{0}', inputs.version) || '') }}

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version from the tag
        if: env.TAG != ''
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"
      - name: Player build
        run: npm run build:prod
      # electron-builder makes the Windows portable .exe on Linux without Wine (no signing)
      - name: Package
        run: npx electron-builder --win portable --linux AppImage --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: spell-vs-steel-desktop
          path: |
            release/*.exe
            release/*.AppImage
          retention-days: 30

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Player build
        run: npm run build:prod
      - name: Copy the game into the Android project
        run: npx cap sync android
      # the runner image has the Android SDK; the APK is signed with the play-test key from the repo secrets
      - name: Build the APK
        working-directory: android
        env:
          SVS_VERSION_CODE: ${{ github.run_number }}
          SVS_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          SVS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          v="${TAG#v}"; export SVS_VERSION="${v:-0.0.0}"
          if [ -n "$SVS_KEYSTORE_B64" ]; then echo "$SVS_KEYSTORE_B64" | base64 -d > app/playtest.keystore
          else echo "::warning::ANDROID_KEYSTORE_B64 is not set; the APK gets a throwaway debug key and won't install over older ones"; fi
          ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: |
          v="${TAG#v}"; v="${v:-dev}"
          mkdir -p release && cp android/app/build/outputs/apk/debug/app-debug.apk "release/SpellVsSteel-$v-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: spell-vs-steel-android
          path: release/*.apk
          retention-days: 30

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "Spell VS Steel $TAG" --generate-notes
