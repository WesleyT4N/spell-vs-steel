# Desktop builds for play-testers. Push a tag like v0.2.0, or run it by hand (Actions > Desktop builds)
# with a version filled in, and the Windows .exe and Linux AppImage are attached to a GitHub Release of
# that name (the run makes the tag on the commit it built). Run it with the version left blank to get the
# files as a workflow artifact only. Both are unsigned: Windows shows a SmartScreen "More info > Run anyway".
name: Desktop builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.2.0 (blank: build only, no Release)'
        required: false
        default: ''

permissions:
  contents: write

env:
  # the tag being released: the pushed tag, or v<version> from a manual run (empty: no Release)
  TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.version != '' && format('v{0}', inputs.version) || '') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version from the tag
        if: env.TAG != ''
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"
      - name: Player build
        run: npm run build:prod
      # electron-builder makes the Windows portable .exe on Linux without Wine (no signing)
      - name: Package
        run: npx electron-builder --win portable --linux AppImage --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: spell-vs-steel-desktop
          path: |
            release/*.exe
            release/*.AppImage
          retention-days: 30
      - name: Release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" release/*.exe release/*.AppImage --target "$GITHUB_SHA" --title "Spell VS Steel $TAG" --generate-notes
